// Puro Kotlin/JVM, non una libreria Android: il dominio deve essere visibile a :nowcast e
// :testbench (anch'essi JVM puri), e non contiene nulla di Android. E' questa scelta che permette
// alla pipeline di essere verificata sul computer con gli stessi tipi che girano sul telefono.
plugins {
  id 'org.jetbrains.kotlin.jvm'
}

apply from: "${rootDir}/engine/versions.gradle"

kotlin {
  jvmToolchain(17)
}

dependencies {
  testImplementation "junit:junit:${engine.junit}"
}
