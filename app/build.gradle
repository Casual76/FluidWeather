plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${rootDir}/engine/versions.gradle"

// La chiave Google Maps del radar vive in local.properties (fuori da git) ed entra nel
// manifest come meta-data: e' l'unico modo in cui l'SDK la legge. Assente = radar che
// spiega il motivo, non build rotta.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Firma di release condivisa con le altre app Pampa (pampa.jks). Le quattro chiavi pampa.* stanno
// in local.properties, fuori da git:
//   pampa.storeFile=C:/VibeCoded projects/pampa.jks
//   pampa.storePassword=...
//   pampa.keyAlias=pampa
//   pampa.keyPassword=...
// Senza, la release si compila ma resta non firmata, e il publisher del Pampa Store la rifiuta.
def releaseStoreFile = (localProperties.getProperty('pampa.storeFile') ?: '').trim()
def releaseStorePassword = (localProperties.getProperty('pampa.storePassword') ?: '').trim()
def hasReleaseKey = !releaseStoreFile.isEmpty() && !releaseStorePassword.isEmpty()

// Dove l'app pubblica: lo stesso manifest.json che il Pampa Store legge, alla radice del repo
// (fase 18). L'updater in-app e la config remota leggono da qui; una sola fonte, mai due versioni.
def manifestUrl = 'https://raw.githubusercontent.com/Casual76/FluidWeather/main/manifest.json'

android {
  namespace 'dev.pampa.fluidweather'
  compileSdk engine.compileSdk

  defaultConfig {
    applicationId 'dev.pampa.fluidweather'
    minSdk engine.minSdk
    targetSdk engine.compileSdk
    versionCode 5
    versionName '1.0.4'
    manifestPlaceholders = [mapsApiKey: localProperties.getProperty('maps.apiKey', '')]
    buildConfigField 'String', 'MANIFEST_URL', "\"${manifestUrl}\""
    // La prima release esce su beta (decisione 2026-09-02): chi la installa segue beta finche'
    // non sceglie altro in Informazioni. Quando si promuove a stable, questo diventa "stable".
    buildConfigField 'String', 'DEFAULT_UPDATE_CHANNEL', '"beta"'
  }

  signingConfigs {
    if (hasReleaseKey) {
      release {
        storeFile file(releaseStoreFile)
        storePassword releaseStorePassword
        keyAlias localProperties.getProperty('pampa.keyAlias', 'pampa')
        keyPassword (localProperties.getProperty('pampa.keyPassword') ?: releaseStorePassword)
        // Anche la firma v1 (JAR): il publisher del Pampa Store la cerca per dire "firmato".
        // Android da 7.0 in su verifica comunque la v2, che resta la firma che conta.
        enableV1Signing true
        enableV2Signing true
      }
    }
  }

  buildTypes {
    debug {
      // Un suffisso, così una build di lavoro convive sul telefono con quella dello store.
      applicationIdSuffix '.debug'
      minifyEnabled false
    }
    release {
      // R8 alleggerisce, ma NON rinomina: la regola `-dontobfuscate` sta in proguard-rules.pro.
      // Il crash del 2026-09-03 (una chiave IA che non si salvava) si e' letto solo perche' la
      // traccia aveva i nomi veri; l'app si prova su un telefono senza computer attaccato, e una
      // traccia offuscata li' non serve a niente. Il taglio del codice morto resta.
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (hasReleaseKey) {
        signingConfig signingConfigs.release
      }
    }
  }

  // Solo le due lingue dell'app: le risorse di altre lingue portate dalle librerie non entrano.
  androidResources {
    localeFilters += ['en', 'it']
  }

  buildFeatures {
    compose true
    // BuildConfig.VERSION_NAME per la pagina Informazioni.
    buildConfig true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  implementation project(':feature-home')
  implementation project(':feature-radar')
  implementation project(':feature-benchmark')
  implementation project(':feature-settings')
  implementation project(':feature-report')
  implementation project(':feature-assistant')  // l'assistente IA (fase 19)
  implementation project(':core-ui')
  implementation project(':core-sensor')      // porta con se' core-data e core-model (api)
  implementation project(':core-weather')     // il livello provider (fase 6)
  implementation project(':core-cycle')       // ciclo in background e notifiche (fase 11)
  implementation project(':core-ai')          // assistente IA: provider, tool, orchestratore (fase 19)

  implementation project(':engine-ui')        // design system (porta con se' Compose e engine-foundation)
  implementation project(':engine-storage')   // impostazioni su DataStore
  implementation project(':engine-config')    // feature flag remoti
  implementation project(':engine-update')    // aggiornamento in-app

  implementation "androidx.activity:activity-compose:${engine.activityCompose}"
  implementation "androidx.navigation:navigation-compose:${engine.navigation}"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:${engine.lifecycle}"
}
