pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "FluidWeather"

include ':app'
include ':feature-home'
include ':feature-radar'
include ':feature-benchmark'
include ':feature-settings'
include ':feature-report'
// L'assistente IA (fase 19): la UI in vetro (aureola, barra, card) e le impostazioni IA.
include ':feature-assistant'
include ':core-ui'
include ':core-sensor'
include ':core-model'
// Tutte le parole dell'app (IT/EN) e la mappa dai modelli alle parole (fase 17).
include ':core-strings'
include ':core-data'
include ':core-weather'
// Il ciclo in background: giro meteo, verdetto, notifiche (fase 11).
include ':core-cycle'
// L'assistente IA (fase 19): client dei provider, tool sui dati, orchestratore, voce, radar numerico.
include ':core-ai'
// Puro Kotlin/JVM, zero Android: la pipeline di nowcast si verifica sul computer.
include ':nowcast'
// Banco di prova JVM: dataset, replay, metriche. Non spedito nell'APK.
include ':testbench'

// --- fluid-engine (inizio) ---
def engineDir = file('engine')
if (engineDir.exists()) {
  [
   'engine-foundation',
   'engine-ui',
   'engine-storage',
   'engine-net',
   'engine-config',
   'engine-update'
  ].each { name ->
    include ":$name"
    project(":$name").projectDir = new File(engineDir, name)
  }
}
// --- fluid-engine (fine) ---
