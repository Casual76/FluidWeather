plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"

android {
  namespace 'dev.pampa.fluidweather.core.sensor'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  api project(':core-data')
  // La marcia di sorveglianza decide sulla tendenza pulita (stadi 1-2), non sul segnale grezzo.
  api project(':nowcast')
  // I testi delle notifiche di servizio (taratura, sorveglianza).
  implementation project(':core-strings')

  implementation "androidx.core:core-ktx:${engine.coreKtx}"
  implementation "androidx.work:work-runtime-ktx:${appVersions.work}"
  // La posizione e' il LocationManager di Android, e il movimento sono i sensori del telefono:
  // niente Google Play Services (libreria proprietaria, fuori da un'app GPL-3.0).
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${engine.coroutines}"

  testImplementation "junit:junit:${engine.junit}"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${engine.coroutinesTest}"
}
