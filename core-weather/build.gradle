plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply from: "${rootDir}/engine/versions.gradle"

android {
  namespace 'dev.pampa.fluidweather.core.weather'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  api project(':core-model')
  api project(':core-data')
  // NowcastContext: il livello provider e' cio' che porta il contesto vero al verdetto.
  api project(':nowcast')
  // EngineHttp: le due chiamate HTTP dell'engine bastano anche a noi.
  implementation project(':engine-net')

  // Solo il runtime (JsonElement): niente plugin del compilatore, i JSON dei provider si
  // navigano a mano perche' ogni campo mancante e' una decisione, non un default.
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${engine.serialization}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${engine.coroutines}"

  testImplementation "junit:junit:${engine.junit}"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${engine.coroutinesTest}"
}
