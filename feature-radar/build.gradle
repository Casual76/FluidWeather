plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${rootDir}/engine/versions.gradle"
apply from: "${rootDir}/versions-app.gradle"

android {
  namespace 'dev.pampa.fluidweather.feature.radar'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  implementation project(':engine-ui')
  // Il tema (chiaro/scuro) vive nelle impostazioni del motore: la mappa e i controlli lo seguono.
  implementation project(':engine-storage')
  implementation project(':core-ui')
  api project(':core-sensor')
  api project(':core-weather')

  implementation "com.google.maps.android:maps-compose:${appVersions.mapsCompose}"
  implementation "com.google.android.gms:play-services-maps:${appVersions.playServicesMaps}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${engine.coroutines}"

  testImplementation "junit:junit:${engine.junit}"
}
